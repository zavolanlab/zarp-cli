name: zarp-cli
channels:
  - conda-forge
  - bioconda
dependencies:
  - addict >=2.4.0
  - bidict >=0.22.0
  - email-validator >=1.2.1
  - genomepy >=0.15.0
  - conda-forge::graphviz
  - jsonref >=0.2
  - numpy >=1.22, <2
  - pandas >=1.3.5, <2
  - pip >=22.1
  - pydantic >=1.9.2, <2
  - pygments >=2.8.0
  - conda-forge::pyopenssl>=23.2.0
  - conda-forge::python>=3.11
  - rich >=12.5.1
  - bioconda::snakemake>=9.8
  - bioconda::snakemake-executor-plugin-cluster-generic
  - pip:
    - -e ..
