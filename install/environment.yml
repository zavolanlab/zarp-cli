name: zarp-cli
channels:
  - conda-forge
  - bioconda
dependencies:
  - addict >=2.4.0
  - bidict >=0.22.0
  - email-validator >=1.2.1
  - genomepy >=0.15.0
  - jsonref >=0.2
  - numpy >=1.22, <2
  - pandas >=1.3.5, <2
  - pip >=22.1
  - pydantic >=1.9.2, <2
  - pygments >=2.8.0
  - python >=3.11
  - rich >=12.5.1
  - snakemake >=8
  - pip:
    - -e ..
